# docker-compose.yml fuer Portainer - Stack aus GHCR-Image beziehen
# Nutzt das externe Docker-Netzwerk "highfishNetwork" (muss in Portainer/Docker
# bereits existieren, z.B. fuer Reverse-Proxy/andere Services im selben Netz).
#
# Variablen im Portainer-Feld "Environment variables" pflegen (alle optional):
#   TELEGRAM_BOT_TOKEN       Token von @BotFather (leer = Bot bleibt aus)
#   TELEGRAM_ALLOWED_IDS     erlaubte Telegram-IDs, kommagetrennt (leer = Bot gesperrt)
#   TELEGRAM_STARTUP_NOTIFY  1 = Startmeldung an erlaubte IDs, 0 = aus (Standard 1)
#   TZ                       Zeitzone fuer die Startmeldung (Standard Europe/Berlin)
services:
  shakeymakey:
    image: ghcr.io/jbkunama1/trt.shakeymakey:latest
    container_name: shakeymakey
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - shakeymakey_data:/data
    environment:
      - TEAMSHAKE_DB=/data/teamshake.db
      - TEAMSHAKE_MAX_DRAWS=50
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_IDS=${TELEGRAM_ALLOWED_IDS:-}
      - TELEGRAM_STARTUP_NOTIFY=${TELEGRAM_STARTUP_NOTIFY:-1}
      - TZ=${TZ:-Europe/Berlin}
    networks:
      - highfishNetwork

networks:
  highfishNetwork:
    external: true

volumes:
  shakeymakey_data:
